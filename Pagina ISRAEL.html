<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iglesia Israel Oficial - Enlaces y Redes Sociales</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Cinzel"', 'serif'],
                    },
                    colors: {
                        brand: {
                            teal: '#00f2fe',
                            blue: '#4facfe',
                            purple: '#7f00ff',
                            darkBg: '#080a10',
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 6s ease-in-out infinite alternate',
                        'float': 'float 4s ease-in-out infinite',
                        'shimmer': 'shimmer 2.5s infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { opacity: '0.4', transform: 'scale(1) rotate(0deg)' },
                            '100%': { opacity: '0.75', transform: 'scale(1.15) rotate(10deg)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        },
                        shimmer: {
                            '100%': { transform: 'translateX(100%)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Estilos personalizados y utilidades de cristal */
        body {
            background-color: #06070b;
            color: #f3f4f6;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Ambient glowing lights inspired by the slide artwork */
        .glow-teal {
            background: radial-gradient(circle, rgba(0, 242, 254, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
        }
        .glow-blue {
            background: radial-gradient(circle, rgba(0, 114, 255, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
        }
        .glow-purple {
            background: radial-gradient(circle, rgba(127, 0, 255, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
        }

        /* Tarjeta con efecto Cristal Líquido (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 40px 0 rgba(0, 242, 254, 0.18);
            transform: translateY(-3px);
        }

        .glass-card:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* Gradiente para Instagram Icon */
        .instagram-gradient {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative select-none">

    <!-- LUCES DE FONDO AMBIENTALES (Inspiradas en el diseño proyectado) -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <!-- Luz Cian Top-Left -->
        <div class="absolute -top-32 -left-32 w-96 h-96 glow-teal rounded-full animate-pulse-glow"></div>
        <!-- Luz Azul Bottom-Right -->
        <div class="absolute -bottom-32 -right-32 w-[32rem] h-[32rem] glow-blue rounded-full animate-pulse-glow" style="animation-delay: 2s;"></div>
        <!-- Luz Violeta Center-Right -->
        <div class="absolute top-1/3 -right-24 w-80 h-80 glow-purple rounded-full animate-pulse-glow" style="animation-delay: 4s;"></div>
    </div>

<!-- MARCA DE AGUA DE FONDO (Centrada, grande y sutil) -->
<div class="fixed inset-0 flex items-center justify-center pointer-events-none z-0 overflow-hidden">
    <img id="churchLogo" 
         src="LOGOaplicaciones-06.png" 
         alt="" 
         class="w-[85vw] max-w-5xl object-contain opacity-15 select-none">
</div>

<!-- CONTENEDOR PRINCIPAL (Ahora sube y queda perfectamente centrado) -->
<main class="w-full max-w-md px-5 py-10 z-10 flex flex-col items-center mx-auto my-auto">

        <!-- TÍTULO Y MANEJO DE MARCA -->
        <header class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white mb-1">
                Iglesia Israel Oficial
            </h1>
            <div class="inline-block px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-400/20 text-cyan-300 font-semibold text-sm mb-3">
                @IglesiaIsraelOficial
            </div>
            <p class="text-gray-300 text-xs sm:text-sm max-w-xs mx-auto leading-relaxed">
                Conéctate con nosotros y síguenos en nuestras redes sociales oficiales.
            </p>
        </header>

        <!-- ENLACES A REDES SOCIALES (CARDS INTERACTIVAS) -->
        <section class="w-full space-y-4" aria-label="Redes Sociales">

            <!-- 1. YOUTUBE -->
            <a href="https://www.youtube.com/@IglesiaIsraelOficial" 
               target="_blank" 
               rel="noopener noreferrer" 
               aria-label="Ir al canal de YouTube de Iglesia Israel Oficial"
               class="glass-card group w-full p-4 rounded-2xl flex items-center space-x-4 cursor-pointer relative overflow-hidden">
                <!-- Shimmer highlight effect -->
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent -translate-x-full group-hover:animate-shimmer"></div>
                
                <!-- Icono Youtube -->
                <div class="w-13 h-13 min-w-[3.25rem] min-h-[3.25rem] rounded-xl bg-red-600/20 border border-red-500/30 flex items-center justify-center text-red-500 group-hover:scale-110 transition-transform duration-300 shadow-lg shadow-red-900/30">
                    <i class="fa-brands fa-youtube text-2xl"></i>
                </div>

                <!-- Detalles de la red -->
                <div class="flex-1 text-left min-w-0">
                    <div class="flex items-center justify-between">
                        <h2 class="text-base font-bold text-white group-hover:text-red-400 transition-colors">
                            YouTube
                        </h2>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-gray-500 group-hover:text-white transition-colors"></i>
                    </div>
                    <p class="text-xs text-gray-400 truncate mt-0.5">
                        Transmisiones en vivo, prédicas y mensajes
                    </p>
                </div>
            </a>

            <!-- 2. FACEBOOK -->
            <a href="https://www.facebook.com/IglesiaIsraell" 
               target="_blank" 
               rel="noopener noreferrer" 
               aria-label="Ir a la página de Facebook de Iglesia Israel Oficial"
               class="glass-card group w-full p-4 rounded-2xl flex items-center space-x-4 cursor-pointer relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent -translate-x-full group-hover:animate-shimmer"></div>
                
                <!-- Icono Facebook -->
                <div class="w-13 h-13 min-w-[3.25rem] min-h-[3.25rem] rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 group-hover:scale-110 transition-transform duration-300 shadow-lg shadow-blue-900/30">
                    <i class="fa-brands fa-facebook-f text-2xl"></i>
                </div>

                <!-- Detalles -->
                <div class="flex-1 text-left min-w-0">
                    <div class="flex items-center justify-between">
                        <h2 class="text-base font-bold text-white group-hover:text-blue-400 transition-colors">
                            Facebook
                        </h2>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-gray-500 group-hover:text-white transition-colors"></i>
                    </div>
                    <p class="text-xs text-gray-400 truncate mt-0.5">
                        Comunidad
                    </p>
                </div>
            </a>

            <!-- 3. INSTAGRAM -->
            <a href="https://www.instagram.com/IglesiaIsraelOficial" 
               target="_blank" 
               rel="noopener noreferrer" 
               aria-label="Ir al perfil de Instagram de Iglesia Israel Oficial"
               class="glass-card group w-full p-4 rounded-2xl flex items-center space-x-4 cursor-pointer relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent -translate-x-full group-hover:animate-shimmer"></div>
                
                <!-- Icono Instagram Gradiente -->
                <div class="w-13 h-13 min-w-[3.25rem] min-h-[3.25rem] rounded-xl instagram-gradient p-[1px] flex items-center justify-center group-hover:scale-110 transition-transform duration-300 shadow-lg shadow-pink-900/30">
                    <div class="w-full h-full bg-slate-950/80 rounded-[11px] flex items-center justify-center text-pink-400 group-hover:bg-slate-950/60 transition-colors">
                        <i class="fa-brands fa-instagram text-2xl"></i>
                    </div>
                </div>

                <!-- Detalles -->
                <div class="flex-1 text-left min-w-0">
                    <div class="flex items-center justify-between">
                        <h2 class="text-base font-bold text-white group-hover:text-pink-400 transition-colors">
                            Instagram
                        </h2>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-gray-500 group-hover:text-white transition-colors"></i>
                    </div>
                    <p class="text-xs text-gray-400 truncate mt-0.5">
                        Eventos, avisos de la congregación y más
                    </p>
                </div>
            </a>

        </section>

    </main>

    <!-- PIE DE PÁGINA (FRASE INSPIRADORA DE LA DIAPOSITIVA) -->
    <footer class="w-full py-6 text-center z-10 border-t border-white/5 bg-black/30 backdrop-blur-sm">
        <p class="text-xs sm:text-sm font-semibold tracking-widest text-gray-400 uppercase">
            PREPARA TU CORAZÓN<span class="animate-pulse text-cyan-400">.......</span>
        </p>
    </footer>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // Manejo de error si 'logo.png' no se encuentra en la carpeta del proyecto
        function handleLogoError(imgElement) {
            imgElement.style.display = 'none';
            const fallbackSvg = document.getElementById('fallbackSvgLogo');
            if (fallbackSvg) {
                fallbackSvg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
